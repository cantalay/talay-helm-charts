nameOverride: ""
fullnameOverride: ""
environment: dev
partOf: talay

replicaCount: 1
revisionHistoryLimit: 5
image:
  repository: example.invalid/talay/web
  tag: "0.0.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

registrySecret:
  enabled: false
  refreshInterval: 1h
  secretStoreName: vault
  secretStoreKind: ClusterSecretStore
  remoteKey: platform/registry/ghcr
  targetName: ghcr-pull

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true

containerPort: 8080
webRoot: /usr/share/nginx/html
runtimeConfig: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts: []
  tls: []

probes:
  readiness:
    path: /healthz
  liveness:
    path: /healthz

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
