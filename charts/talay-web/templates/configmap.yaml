apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talay.fullname" . }}
  labels:
    {{- include "talay.labels" . | nindent 4 }}
data:
  runtime-config.js: |-
    window.__TALAY_CONFIG__ = {{ .Values.runtimeConfig | toJson }};
  default.conf: |-
    server {
      listen {{ .Values.containerPort }};
      server_name _;
      root {{ .Values.webRoot }};
      index index.html;
      server_tokens off;

      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options {{ .Values.securityHeaders.xFrameOptions | quote }} always;
      add_header Referrer-Policy {{ .Values.securityHeaders.referrerPolicy | quote }} always;
      add_header Strict-Transport-Security {{ .Values.securityHeaders.strictTransportSecurity | quote }} always;
      add_header Permissions-Policy {{ .Values.securityHeaders.permissionsPolicy | quote }} always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      {{- if .Values.securityHeaders.contentSecurityPolicy }}
      add_header Content-Security-Policy {{ .Values.securityHeaders.contentSecurityPolicy | quote }} always;
      {{- end }}

      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
      }

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /runtime-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
      }

      location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }

      location / {
        sub_filter '</head>' '<script src="/runtime-config.js"></script></head>';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
      }
    }
