{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "talay.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "talay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.denyEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  {{- if .Values.networkPolicy.denyEgress }}
  egress: []
  {{- end }}
{{- end }}
